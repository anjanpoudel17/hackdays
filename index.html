<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>medtracker | Modern Medication Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="app-container">
    
    <!-- Top Header Card -->
    <header class="app-header">
      <div class="brand">
        <div class="logo">💊</div>
        <div>
          <h1>medtracker</h1>
          <p id="date-display">Loading date...</p>
        </div>
      </div>
      <button id="reset-btn" class="btn-ghost" title="Reset all medications for a new day">
        <span class="icon">🔄</span> Reset Day
      </button>
    </header>

    <!-- Stat Dashboard Cards -->
    <section class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon icon-total">📋</div>
        <div class="stat-info">
          <span class="stat-label">Total</span>
          <span id="stat-total" class="stat-number">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-taken">✅</div>
        <div class="stat-info">
          <span class="stat-label">Taken</span>
          <span id="stat-taken" class="stat-number text-success">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon icon-pending">⏳</div>
        <div class="stat-info">
          <span class="stat-label">Pending</span>
          <span id="stat-pending" class="stat-number text-warning">0</span>
        </div>
      </div>
    </section>

    <!-- Add Medication Card -->
    <section class="card">
      <h2 class="card-title">Add Medication</h2>
      <form id="med-form">
        <div class="form-group">
          <label for="name">Medication Name</label>
          <input type="text" id="name" placeholder="e.g., Amoxicillin" required />
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="dosage">Dosage / Instructions</label>
            <input type="text" id="dosage" placeholder="e.g., 500mg with water" required />
          </div>
          <div class="form-group">
            <label for="time">Scheduled Time</label>
            <input type="time" id="time" required />
          </div>
        </div>

        <button type="submit" class="btn-primary">
          <span>+ Add to Schedule</span>
        </button>
      </form>
    </section>

    <!-- Medication List Card -->
    <section class="card">
      <div class="list-header">
        <h2 class="card-title">Today's Schedule</h2>
        <div class="filter-tabs">
          <button class="filter-btn active" data-filter="all">All</button>
          <button class="filter-btn" data-filter="pending">Pending</button>
          <button class="filter-btn" data-filter="taken">Taken</button>
        </div>
      </div>

      <div id="med-list" class="med-list"></div>
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
